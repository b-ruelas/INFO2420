<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rent a Pet - Graphics</title>

<style type="text/css">

	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
		cursor: pointer;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image

	if (document.images) {
		PrintButton1.src = "images/print5.gif"
		PrintButton2.src = "images/print6.gif"
		logo1.src = "images/logo1.jpg"
		logo2.src = "images/logo2.jpg"
	}

	var imgArray = new Array(
		'dogtrick2lg.jpg',
		'huntingdogslg.jpg',
		'hamsterlg.jpg',
		'birddoglg.jpg'
	);

	var titleArray = new Array(
		'Dog Performing a Trick',
		'Hunting Dogs',
		'Hamster',
		'Bird Dog'
	);

	var imgPath = "images/fullsize/";

	function swapImage(imgID) {

		var theImage = document.getElementById('theImage');
		var textDiv = document.getElementById('bottomText');

		var newImg;
		var textTitle;

		newImg = imgArray[imgID];
		theImage.src = imgPath + newImg;

		textTitle = titleArray[imgID];

		textDiv.innerHTML = textTitle;
	}

	function preloadImages() {
		for (var i = 0; i < imgArray.length; i++) {
			var tmpImg = new Image;
			tmpImg.src = imgPath + imgArray[i];
		}
	}

</script>

</head>
<body onload="preloadImages()">

<div align="center">

	<div>
		<a href="" onMouseOver="document.PrintButton.src=PrintButton2.src;"
		   onMouseOut="document.PrintButton.src=PrintButton1.src;">

			<img src="images/print5.gif" width="250" height="50"
			     name="PrintButton" alt="Print Page Button" style="border:none;"/>

		</a>
	</div>

	<div id="logo">
		<a href="logo.html" onMouseOver="document.logo.src=logo2.src;"
		   onMouseOut="document.logo.src=logo1.src;">

			<img src="images/logo1.jpg" width="133" height="126"
			     name="logo" alt="Rent a Pet Logo" style="border:none;"/>

		</a>
	</div>

	<br />
	<br />
	<br />
	<br />

	<p class="instructions">Roll over a thumbnail below to view a larger image.</p>

	<div id="thumbs">
		<img src="images/thumbnails/dogtrick2sm.jpg" alt="Dog doing a Trick" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/huntingdogssm.jpg" alt="Hunting Dogs" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/hamstersm.jpg" alt="Hamster" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/birddogsm.jpg" alt="Bird Dog" onmouseover="swapImage(3);" />
	</div>

	<div id="image">
		<img id="theImage" src="images/fullsize/dogtrick2lg.jpg" alt="Dog Performing a Trick" />
		<h3 id="bottomText">Dog Performing a Trick</h3>
	</div>

	<br />
	<br />

	<img src="images/2colback.jpg" alt="Two Column Background Sample" />

	<br />
	<br />
	<br />
	<br />

	<p>
		<a href="http://validator.w3.org/check?uri=referer"><img
		src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
	</p>

</div>

</body>
</html>
