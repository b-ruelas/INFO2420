<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>JavaScript Practice 1- Slideshow</title>

<style type="text/css">

.flashclass{
    height: 200px;
    width: 150px;
    border: 5px solid orange;
    padding: 5px;
    text-align: center;
}

.flashclass img{
	border-width: 0;
}

</style>

<script type="text/javascript" src="transitionshow.js">

/***********************************************
* Random Transitions Slideshow- by JavaScript Kit (www.javascriptkit.com)
* This notice must stay intact for usage
* Visit JavaScript Kit at http://www.javascriptkit.com/ for full source code
***********************************************/

</script>

</head>

<body >

	<div id="myslideshow"></div>

<script type="text/javascript">

var flashyshow=new flashyslideshow({ //create instance of slideshow
	wrapperid: "myslideshow", //unique ID for this slideshow
	wrapperclass: "flashclass", //desired CSS class for this slideshow
	imagearray: [
		["Images/Thumbnails/CoupleSailingSm.jpg", "", "", "Newlyweds Sailing"],
		["Images/Thumbnails/PigSm.jpg", "", "", "Boy and His Pig"],
		["Images/Thumbnails/SaladSm.jpg", "", "", "Yummy Salad"],
		["Images/Thumbnails/StorkSm.jpg", "", "", "Stork at Sunset"],
		["Images/Thumbnails/HamsterSm.jpg", "", "", "Cute Hamster"]
	],
	pause: 2000, //pause between content change (millisec)
	transduration: 1000 //duration of transition (affects only IE users)
})

</script>
		
	
	</body>

</html>
